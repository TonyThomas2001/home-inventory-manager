<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Add Inventory Item - Home Inventory Management</title>
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500&family=Inria+Serif:wght@700&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body class="mypage-item-form">
    <div class="topbar">
      <a href="inventory.html">My Inventory</a>
      <a
        href="admin-dashboard.html"
        id="adminDashboardLink"
        style="display: none"
        >Admin Dashboard</a
      >
      <a href="#" id="logoutBtn">Logout</a>
    </div>

    <h1 class="page-title">Add Inventory Item</h1>

    <form class="item-form" id="itemForm" novalidate>
      <div class="field" id="nameField">
        <label for="itemName">Item Name</label>
        <input
          type="text"
          id="itemName"
          name="itemName"
          required
          maxlength="20"
        />
        <div class="error-text">Item name is required</div>
      </div>

      <div class="field" id="categoryField">
        <label for="category">Category</label>
        <select id="category" name="category" required>
          <option value="" disabled selected>Select Category</option>
          <option value="Electronics">Electronics</option>
          <option value="Appliances">Appliances</option>
          <option value="Furniture">Furniture</option>
          <option value="Clothing">Clothing</option>
          <option value="Other">Other</option>
        </select>
        <div class="error-text">Category is required</div>
      </div>

      <div class="row">
        <div class="field" id="quantityField">
          <label for="quantity">Quantity</label>
          <input
            type="number"
            id="quantity"
            name="quantity"
            min="0"
            step="1"
            required
          />
          <div class="error-text">Quantity is required</div>
        </div>

        <div class="field" id="priceField">
          <label for="price">Price</label>
          <div class="price-wrap">
            <span>$</span>
            <input
              type="number"
              id="price"
              name="price"
              min="0"
              max="999999"
              step="0.01"
              required
            />
          </div>
          <div class="error-text">Price is required</div>
        </div>
      </div>

      <div class="field" id="locationField">
        <label for="location">Location</label>
        <select id="location" name="location" required>
          <option value="" disabled selected>Select Location</option>
          <option value="Bedroom">Bedroom</option>
          <option value="Kitchen">Kitchen</option>
          <option value="Living Room">Living Room</option>
          <option value="Garage">Garage</option>
          <option value="Office">Office</option>
          <option value="Other">Other</option>
        </select>
        <div class="error-text">Location is required</div>
      </div>

      <div class="field">
        <label for="description">Description (under 150 characters)</label>
        <textarea
          id="description"
          name="description"
          maxlength="150"
        ></textarea>
      </div>

      <div class="actions">
        <button type="submit" class="submit-btn">Add item</button>
        <button type="button" class="cancel-btn" id="cancelBtn">CANCEL</button>
      </div>
    </form>

    <script src="api-config.js"></script>
    <script src="item-form-script.js"></script>
  </body>
</html>

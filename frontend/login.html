<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Login - Home Inventory Management</title>
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700&family=Inria+Serif:wght@700&family=Kanit:wght@400&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body class="page-login">
    <h1 class="brand-title">Home Inventory Management</h1>

    <div class="hero">
      <img src="assets/applogo.svg" alt="Home inventory illustration" />
    </div>

    <h2 class="welcome-title">Welcome Back</h2>

    <div class="login-card">
      <div class="error-banner" id="errorBanner">
        Invalid email or password.
      </div>

      <form id="loginForm">
        <div class="field">
          <label for="email">Email</label>
          <input type="email" id="email" name="email" required />
        </div>

        <div class="field">
          <label for="password">Password</label>
          <input type="password" id="password" name="password" required />
        </div>

        <div class="row-between">
          <a href="#" id="forgotPasswordLink">Forgot Password?</a>
        </div>

        <button type="submit" class="login-btn">LOGIN</button>
      </form>

      <div class="divider">
        <hr />
        <span>OR</span>
        <hr />
      </div>

      <div class="social-row">
        <button
          class="social-btn"
          id="googleLogin"
          aria-label="Sign in with Google"
        >
          <svg viewBox="0 0 24 24">
            <path
              fill="#4285F4"
              d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z"
            />
            <path
              fill="#34A853"
              d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z"
            />
            <path
              fill="#FBBC05"
              d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l2.85-2.22.81-.62z"
            />
            <path
              fill="#EA4335"
              d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z"
            />
          </svg>
        </button>
        <button
          class="social-btn"
          id="appleLogin"
          aria-label="Sign in with Apple"
        >
          <svg viewBox="0 0 24 24">
            <path
              fill="#000"
              d="M16.365 1.43c0 1.14-.468 2.221-1.235 3.03-.833.883-2.192 1.567-3.293 1.478-.14-1.1.42-2.25 1.19-3.02.83-.85 2.28-1.49 3.338-1.488zM20.63 17.09c-.51 1.18-.752 1.71-1.407 2.75-.913 1.45-2.202 3.26-3.797 3.27-1.416.02-1.78-.923-3.7-.913-1.918.01-2.318.933-3.735.913-1.596-.02-2.815-1.65-3.728-3.1-2.556-4.04-2.822-8.78-1.246-11.3.99-1.583 2.557-2.51 4.032-2.51 1.502 0 2.446.913 3.69.913 1.207 0 1.94-.914 3.7-.914 1.31 0 2.7.712 3.7 1.94-3.25 1.78-2.723 6.42.49 7.95z"
            />
          </svg>
        </button>
      </div>

      <p class="register-line">
        Don't have an account?
        <a href="#" id="registerLink">Register</a>
      </p>
    </div>

    <script src="api-config.js"></script>
    <script src="login-script.js"></script>
  </body>
</html>

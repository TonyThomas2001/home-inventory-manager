<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Register - Home Inventory Management</title>
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;700;800&family=Inria+Serif:wght@700&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body class="page-register">
    <h1 class="page-title">Register</h1>

    <form class="register-card" id="registerForm">
      <div class="field">
        <label for="firstName">First Name</label>
        <input type="text" id="firstName" name="firstName" required />
      </div>

      <div class="field">
        <label for="lastName">Last Name</label>
        <input type="text" id="lastName" name="lastName" required />
      </div>

      <div class="field">
        <label for="email">Email</label>
        <input type="email" id="email" name="email" required />
        <div class="error" id="emailError">Please enter a valid email.</div>
      </div>

      <div class="field">
        <label for="password">Password</label>
        <input
          type="password"
          id="password"
          name="password"
          required
          minlength="6"
        />
      </div>

      <div class="field">
        <label for="confirmPassword">Confirm Password</label>
        <input
          type="password"
          id="confirmPassword"
          name="confirmPassword"
          required
          minlength="6"
        />
        <div class="error" id="matchError">Passwords do not match.</div>
      </div>

      <button type="submit" class="register-btn">Register</button>
    </form>

    <p class="login-line">
      Already have an account?
      <a href="#" id="loginLink">Login</a>
    </p>

    <script src="api-config.js"></script>
    <script src="script.js"></script>
  </body>
</html>
